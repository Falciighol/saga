[package]
name = "saga"
version = "1.0.4"
description = "A fast, smart sample browser for music producers"
authors = ["falcighol"]
license-file = "../LICENSE"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (see cargo#8519).
name = "saga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "collation", "functions"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rubato = "0.16"
ebur128 = "0.1"
walkdir = "2"
notify = "8"
notify-debouncer-mini = "0.6"
regex = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
thiserror = "2"
base64 = "0.22"
png = "0.17"
signalsmith-stretch = "0.1"
hound = "3"
realfft = "3"
fontdb = "0.24"
trash = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.dev.package."*"]
# Decoding and analysis are painfully slow unoptimized; keep deps fast in dev builds.
opt-level = 3

[profile.dev.package.saga]
# Sound analysis and the sound map are number crunching too; unoptimized they're 20x slower.
opt-level = 2
