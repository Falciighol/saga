# Opens the draft GitHub release for the app's version. This is the only place releases are created;
# the scripts below only add files to the draft it opens, whose notes come from
# .github/RELEASE_TEMPLATE.md. Nothing is built here: the Mac build is made on a Mac with `npm run release:mac` and the Windows build on a PC with `npm run release:windows`
# (notarizing in CI costs too many macOS runner minutes; Windows isn't code-signed, so there's little
# for CI to add). Each of them puts its installer on the draft.
#
# Publishing the draft is what ships the update: installed copies read
# https://github.com/Falciighol/saga/releases/latest/download/latest.json, and drafts never count
# as "latest". See "Releasing" in docs/DEVELOPMENT.md.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Checks the version and opens the draft release (or finds the one `npm run release:mac` opened).
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so the notes can link the changelog from the previous release
      - name: Versions agree
        run: node scripts/version.mjs --check
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version. Run npm run set-version -- <x.y.z> first."
            exit 1
          fi
          find() { gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\""; }
          read -r id draft <<< "$(find | head -1)"
          if [[ -n "$id" && "$draft" != "true" ]]; then
            echo "::error::$tag is already published. Bump the version with npm run set-version -- <x.y.z>."
            exit 1
          fi
          if [[ -z "$id" ]]; then
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Saga $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
